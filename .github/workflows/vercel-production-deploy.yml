name: Deploy Pothub to Vercel Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pothub-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check required Vercel secrets
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "Missing GitHub Actions secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three secrets in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run source checks and tests
        run: npm run check
      - name: Pull Vercel production settings
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build for Vercel production
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production build
        run: npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

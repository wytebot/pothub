name: MonyGist cloud coding agent
on:
  workflow_dispatch:
    inputs:
      task:
        description: Repair or coding task (bounded to 12,000 characters)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: monygist-agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and execute task
        env:
          MONYGIST_TASK: ${{ inputs.task }}
          MONYGIST_PROVIDER: ${{ vars.MONYGIST_PROVIDER }}
          MONYGIST_MODEL: ${{ vars.MONYGIST_MODEL }}
          MONYGIST_API_KEY: ${{ secrets.MONYGIST_API_KEY }}
          MONYGIST_OPENAI_API_KEY: ${{ secrets.MONYGIST_OPENAI_API_KEY }}
          MONYGIST_ANTHROPIC_API_KEY: ${{ secrets.MONYGIST_ANTHROPIC_API_KEY }}
          MONYGIST_GEMINI_API_KEY: ${{ secrets.MONYGIST_GEMINI_API_KEY }}
          MONYGIST_XAI_API_KEY: ${{ secrets.MONYGIST_XAI_API_KEY }}
          MONYGIST_DEEPSEEK_API_KEY: ${{ secrets.MONYGIST_DEEPSEEK_API_KEY }}
          MONYGIST_MISTRAL_API_KEY: ${{ secrets.MONYGIST_MISTRAL_API_KEY }}
          MONYGIST_GROQ_API_KEY: ${{ secrets.MONYGIST_GROQ_API_KEY }}
          MONYGIST_OPENROUTER_API_KEY: ${{ secrets.MONYGIST_OPENROUTER_API_KEY }}
          MONYGIST_TOGETHER_API_KEY: ${{ secrets.MONYGIST_TOGETHER_API_KEY }}
        run: node scripts/monygist-agent.mjs
      - name: Verify tests and build before committing
        if: success()
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then npm test; else echo 'No test script configured; skipping tests.'; fi
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; else echo 'No build script configured; skipping build.'; fi
          fi
      - name: Commit verified changes and push
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name 'MonyGist Agent'
          git config user.email 'monygist-agent@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit -m 'MonyGist agent: apply verified repair'
          git push

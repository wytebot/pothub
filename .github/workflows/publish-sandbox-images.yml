name: Publish Pothub sandbox images
on:
  push:
    branches: [main, master]
    paths:
      - 'sandbox/runner/**'
      - '.github/workflows/publish-sandbox-images.yml'
  workflow_dispatch:
    inputs:
      build_flutter:
        description: Build the large Flutter/Android validation image
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image names
        id: names
        shell: bash
        run: echo "owner=$(echo '${GITHUB_REPOSITORY_OWNER}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish base project engine
        uses: docker/build-push-action@v6
        with:
          context: sandbox/runner/images/node
          file: sandbox/runner/images/node/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/pothub-engine:latest
      - name: Build and publish runner service
        uses: docker/build-push-action@v6
        with:
          context: sandbox/runner
          file: sandbox/runner/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/pothub-runner:latest
      - name: Build and publish Flutter/Android engine (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.build_flutter == true
        uses: docker/build-push-action@v6
        with:
          context: sandbox/runner
          file: sandbox/runner/Dockerfile.flutter
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/pothub-engine-flutter:latest
          build-args: |
            GHCR_OWNER=${{ steps.names.outputs.owner }}

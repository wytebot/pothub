name: Deploy Pothub frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pothub-github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: 'true'
      VITE_API_BASE: https://pothub-self.vercel.app
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate public frontend configuration
        shell: bash
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_API_BASE; do
            if [ -z "${!name}" ]; then echo "Missing GitHub Actions secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "Add the four VITE_FIREBASE_* secrets under repository Settings > Secrets and variables > Actions. These are public Firebase web config values, not private server secrets."; exit 1; fi
          node -e "const u=new URL(process.env.VITE_API_BASE); if(u.protocol!=='https:') process.exit(1)"
      - name: Run source checks and tests
        run: npm run check
      - name: Build GitHub Pages frontend
        run: npm run build && node scripts/configure-pages-build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

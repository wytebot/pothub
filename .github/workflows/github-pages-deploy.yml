name: Deploy Pothub frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pothub-github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: 'true'
      VITE_API_BASE: https://pothub-self.vercel.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate public frontend configuration
        run: |
          if grep -q PASTE_ src/lib/firebase-config.json; then echo "Fill in apiKey and appId in src/lib/firebase-config.json (Firebase console > Project settings > Your apps > SDK setup)."; exit 1; fi
      - name: Run source checks and tests
        run: npm run check
      - name: Build GitHub Pages frontend
        run: npm run build && node scripts/configure-pages-build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

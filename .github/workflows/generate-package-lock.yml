name: Generate and commit PotHub npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pothub-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Validate lockfile with a clean install
        run: npm ci --no-audit --no-fund
      - name: Commit lockfile when it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Generate Pothub npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Validate lockfile with a clean install
        run: npm ci --no-audit --no-fund
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pothub-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 30

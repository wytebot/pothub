services:
  pothub-runner:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/pothub-runner:latest
    restart: unless-stopped
    environment:
      PORT: "8788"
      ENGINE_RUNNER_TOKEN: ${ENGINE_RUNNER_TOKEN:?Set ENGINE_RUNNER_TOKEN}
      DOCKER_SOCKET: /var/run/docker.sock
      RUNNER_IMAGE: ghcr.io/${GHCR_OWNER}/pothub-engine:latest
      RUNNER_FLUTTER_IMAGE: ghcr.io/${GHCR_OWNER}/pothub-engine-flutter:latest
      RUNNER_TIMEOUT_MS: "120000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    # Runner is a trusted Docker controller. Docker socket access is host-root equivalent.
    # Deploy only on a dedicated host and keep the socket inaccessible to other containers.

  pothub-runner-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      pothub-runner:
        condition: service_healthy
    environment:
      RUNNER_DOMAIN: ${RUNNER_DOMAIN:?Set RUNNER_DOMAIN to your DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
